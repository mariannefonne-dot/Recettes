services:
  # Backend Flask
  - type: web
    name: recettes-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recettes-db
          property: connectionString

  # Frontend React (site statique)
  - type: web
    name: recettes-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

databases:
  - name: recettes-db
    plan: free
