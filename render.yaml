services:
  # Backend Flask
  - type: web
    name: recettes-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recettes-db
          property: connectionString

  # Frontend React
  - type: web
    name: recettes-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: recettes-backend
          type: web
          property: host

databases:
  - name: recettes-db
    plan: free
